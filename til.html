<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today I Learned - Personal Website</title>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;600;800&family=Outfit:wght@400;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
    <!-- Navigation -->
    <nav id="navigation"></nav>

    <!-- TIL Content -->
    <section class="til-section">
        <div class="container">
            <h1 class="section-title">Today I Learned</h1>
            <p class="til-intro">A collection of random things I learn day to day.</p>

            <div class="til-grid" id="til-container">
                <!-- Content will be loaded dynamically from til.md -->
                <p class="loading-text">Loading learnings...</p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer id="footer-section"></footer>

    <!-- Load components -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const container = document.getElementById('til-container');

            fetch('til/manifest.json')
                .then(response => response.json())
                .then(entries => {
                    container.innerHTML = ''; // Clear loading text

                    entries.forEach(entry => {
                        const details = document.createElement('details');
                        details.className = 'til-card';
                        details.dataset.filename = entry.filename;

                        const summary = document.createElement('summary');
                        summary.innerHTML = `
                            <span class="til-date">${entry.date}</span>
                            <span class="til-title">${entry.title}</span>
                        `;

                        const divContent = document.createElement('div');
                        divContent.className = 'til-content';
                        divContent.innerHTML = '<p class="loading-content">Loading...</p>'; // Placeholder

                        details.appendChild(summary);
                        details.appendChild(divContent);
                        container.appendChild(details);

                        // Lazy load content on toggle
                        details.addEventListener('toggle', function () {
                            if (this.open && !this.dataset.loaded) {
                                fetch(`til/${this.dataset.filename}`)
                                    .then(res => {
                                        if (!res.ok) throw new Error('Failed to load');
                                        return res.text();
                                    })
                                    .then(markdown => {
                                        divContent.innerHTML = marked.parse(markdown);
                                        this.dataset.loaded = 'true';
                                    })
                                    .catch(err => {
                                        console.error(err);
                                        divContent.innerHTML = '<p>Error loading content.</p>';
                                    });
                            }
                        });
                    });
                })
                .catch(error => {
                    console.error('Error loading TIL manifest:', error);
                    container.innerHTML = '<p>Error loading content list.</p>';
                });
        });
    </script>
</body>

</html>
